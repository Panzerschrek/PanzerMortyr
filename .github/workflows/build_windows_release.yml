name: build_windows_release_x86_64

on: [push]

jobs:
  build_windows_release_x86_64:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v1
      with:
        submodules: recursive
    - name: Download Ü for Windows
      id: download-compiler-for-windows
      uses: dawidd6/action-download-artifact@v2
      with:
        repo: Panzerschrek/U-00DC-Sprache
        branch: master
        workflow: windows.yml
        if_no_artifact_found: fail
    - name: build project
      run: ./ci/build_windows.bat
    - uses: actions/upload-artifact@v4
      with:
        name: panzer_mortyr_windows_x86_64
        path: build/release/panzer_mortyr.exe
